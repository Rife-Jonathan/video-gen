<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>DentalCare Studio — Walkthrough</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");

      :root {
        --ink: #0b1220;
      }

      body {
        margin: 0;
        background: var(--ink);
        font-family: Inter, system-ui, sans-serif;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ink);
      }

      /* Camera moves target .inner, never the timed clip element itself. */
      .inner {
        position: absolute;
        inset: 0;
        will-change: transform, opacity;
      }

      .inner > video {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        object-fit: cover;
        transform: scale(1.015); /* hides the 1px webm edge seam */
      }

      #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse at center,
          rgba(0, 0, 0, 0) 60%,
          rgba(0, 0, 0, 0.24) 100%
        );
      }

      #caption-layer {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 64px;
        display: flex;
        justify-content: center;
      }

      .cue {
        position: absolute;
        bottom: 0;
        max-width: 1500px;
        padding: 16px 34px;
        border-radius: 16px;
        background: rgba(8, 15, 26, 0.84);
        border: 1px solid rgba(255, 255, 255, 0.09);
        color: #f1f5f9;
        font-size: 36px;
        font-weight: 600;
        line-height: 1.34;
        text-align: center;
        letter-spacing: -0.01em;
        box-shadow: 0 16px 44px rgba(0, 0, 0, 0.45);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="{{DURATION}}"
    >
{{VIDEOS}}

      <div id="vignette"></div>

      <div id="caption-layer">
{{CUES}}
      </div>

      <audio id="vo" src="public/audio/voice.wav"
        data-start="0" data-duration="{{DURATION}}" data-track-index="90"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      /* ---------- scene handoffs ----------
         0.10s near-cut inside the fast opening bursts so a spoken list reads as
         separate beats; 0.40s crossfade between walkthrough sections so a topic
         change breathes. */
{{HANDOFF}}

      /* ---------- camera ----------
         Only where the narration points at something specific. Everything else
         holds still, which is what makes these reads as emphasis. */
{{TWEENS}}

      /* ---------- captions ----------
         Times: faster-whisper word-level ASR of the real VO.
         Text: ASR output with its misspellings corrected (build-longform.py). */
      const cues = [
{{CUE_JS}}
      ];

      cues.forEach(([sel, start, end]) => {
        tl.set(sel, { autoAlpha: 0, y: 12 }, 0);
        tl.to(sel, { autoAlpha: 1, y: 0, duration: 0.14, ease: "power2.out" }, start);
        tl.to(sel, { autoAlpha: 0, y: -8, duration: 0.14, ease: "power2.in" }, end);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
